    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      
      .line-clamp-8 {
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 8;
      }

      .no-print {
        display: block; /* Default state */
      }
       
       @page {
          size: A4;
          margin: 1.5cm;
          @bottom-center {
            content: "Pagina " counter(page);
            font-size: 9pt;
            color: #666;
          }
        }
        
        @media print {
            body * {
                visibility: hidden;
            }
            .printable-area, .printable-area * {
                visibility: visible;
            }
            .printable-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .no-print {
                display: none !important;
            }
            .print-block {
                display: block !important;
            }
            .print-table {
                width: 100% !important;
                border-collapse: collapse !important;
            }
            .print-table th, .print-table td {
                border: 1px solid #000 !important;
                padding: 4px !important;
                font-size: 10pt !important;
                color: #000 !important;
            }
            .print-table th {
                background-color: #f0f0f0 !important;
                font-weight: bold !important;
            }
            .print-row {
                break-inside: avoid;
            }
        }
        
        /* Landscape Print Style for Gantt */
        @media print and (orientation: landscape) {
            @page {
                size: landscape;
                margin: 5mm;
            }
            /* Hide Sidebar & Header */
            aside, header, .no-print {
                display: none !important;
            }
            
            /* Reset Layout for Full Width */
            #root > div {
                height: auto !important;
                display: block !important;
            }
            #root > div > div {
                margin-left: 0 !important;
                width: 100% !important;
                display: block !important;
            }
            main {
                padding: 0 !important;
                overflow: visible !important;
            }
            
            /* Target Gantt Specifics */
            .overflow-x-auto {
                overflow: visible !important;
            }
            
            /* Force chart to expand fully */
            .printable-gantt {
                width: 100% !important;
                min-width: 100% !important;
            }
            
            /* Hide Scrollbars visuals */
            ::-webkit-scrollbar {
                display: none;
            }
            
            /* Improve text contrast for print */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            
            /* Ensure background colors print */
            .bg-gray-50, .bg-white {
                background-color: #ffffff !important;
            }
            
            /* Hide UI elements inside chart */
            button, .cursor-ew-resize, .sal-line {
                display: none !important;
            }
            
            /* Show Print Header */
            .print-only-header {
                display: block !important;
                margin-bottom: 20px;
                text-align: center;
                border-bottom: 2px solid #000;
                padding-bottom: 10px;
            }
        }
        
        .print-only-header {
            display: none;
        }
    </style>
